<!DOCTYPE html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css" type="text/css">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>お問い合わせフォーム : 確認画面</title>
<link rel="canonical" href="https://fishtips.sakura.ne.jp/sampleFolder/sampleFileName.html" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body>
<div id="head">
	<div id="head-in"><h1>Fish &amp; Tips についてのお問い合せ</h1></div>
</div>
<div id="body">
<h2>お問い合わせフォーム &gt; 確認画面</h2>
<ul>
	<li>以下の内容でよろしければ「送信する」ボタンを押して下さい。</li>
</ul>
<div id="form-tbl">

<table id="form">
	<!-- cell_begin -->
	<tr>
	  <th>!key!</th>
	  <td>!val!</td>
	</tr>
	<!-- cell_end -->
</table>

<form action="!mail_cgi!" method="post">
	<!-- hidden -->
	<p class="btn">
		<input type="button" value="&lt; 前に戻る" onclick="history.back()">
		<input type="submit" value="送信する &gt;">
	</p>
</form>
</div>
</div>
</body>
</html>
